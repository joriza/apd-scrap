# Configuración de APD-Scrap

# API Configuration
api:
  base_url: "https://servicios3.abc.gob.ar/valoracion.docente/api/apd.oferta.encabezado/select"
  timeout: 60

# Database Configuration
database:
  path: "apd.db"
  batch_size: 1000

# Logging Configuration
logging:
  name: "apd_scrap"
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "apd_scrap.log"
  max_bytes: 5242880  # 5MB
  backup_count: 3
  console_output: true

# Output Configuration
output:
  directory: "."
  format: "json"
  pretty_print: true

# SSL Configuration
ssl:
  ciphers: "ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+HIGH:DH+HIGH:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+HIGH:RSA+3DES:!aNULL:!eNULL:!MD5"

# Environment (development, staging, production)
environment: "development"